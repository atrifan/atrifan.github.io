<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="50%" stop-color="#764ba2"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="tapeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#feca57"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="clockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="80" cy="80" r="75" fill="url(#mainGradient)"/>

  <!-- Digital Scale -->
  <rect x="45" y="85" width="70" height="45" rx="8" fill="#fff" opacity="0.95"/>
  <rect x="50" y="90" width="60" height="25" rx="4" fill="url(#screenGradient)"/>
  <!-- Scale display -->
  <text x="80" y="108" text-anchor="middle" fill="#4ade80" font-size="14" font-family="monospace" font-weight="bold">-2.5kg</text>
  <!-- Scale feet -->
  <circle cx="52" cy="125" r="4" fill="#e0e0e0"/>
  <circle cx="108" cy="125" r="4" fill="#e0e0e0"/>

  <!-- Measuring Tape -->
  <path d="M25 80 Q25 35 80 30 Q135 35 135 80" fill="none" stroke="url(#tapeGradient)" stroke-width="12" stroke-linecap="round"/>
  <!-- Tape markings -->
  <path d="M35 65 L35 55" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <path d="M55 45 L55 35" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <path d="M80 38 L80 28" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M105 45 L105 35" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <path d="M125 65 L125 55" stroke="#fff" stroke-width="2" stroke-linecap="round"/>

  <!-- Clock -->
  <circle cx="115" cy="65" r="18" fill="#fff" opacity="0.95"/>
  <circle cx="115" cy="65" r="15" fill="none" stroke="url(#clockGradient)" stroke-width="2"/>
  <path d="M115 65 L115 54" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <path d="M115 65 L122 65" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <circle cx="115" cy="65" r="2" fill="#1a1a2e"/>

  <!-- Sparkles -->
  <circle cx="30" cy="95" r="3" fill="#fff" opacity="0.6"/>
  <circle cx="140" cy="50" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="20" cy="55" r="2" fill="#fff" opacity="0.5"/>
</svg>

