<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #831843 0%, #be185d 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 16px; padding: 1.5rem; max-width: 320px; width: 100%; border: 1px solid rgba(255,255,255,0.2); text-align: center; }
    .header { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1rem; }
    .icon { font-size: 1.5rem; }
    .title { color: #fff; font-size: 1.1rem; font-weight: 600; }
    .big-number { font-size: 4rem; font-weight: 800; color: #f472b6; }
    .label { color: rgba(255,255,255,0.8); font-size: 1.1rem; margin-bottom: 0.5rem; }
    .breakdown { color: rgba(255,255,255,0.8); font-size: 1.1rem; margin-bottom: 1rem; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .stat { background: rgba(255,255,255,0.1); padding: 0.75rem; border-radius: 8px; }
    .stat-label { color: rgba(255,255,255,0.6); font-size: 0.75rem; text-transform: uppercase; }
    .stat-value { color: #fff; font-size: 1.1rem; font-weight: 600; margin-top: 0.25rem; }
    .highlight { color: #f472b6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header"><span class="icon">🎂</span><span class="title">Age Calculator</span></div>
    <div id="years" class="big-number">--</div>
    <div class="label">years old</div>
    <div id="breakdown" class="breakdown">-- years, -- months, -- days</div>
    <div class="stats">
      <div class="stat"><div class="stat-label">Total Days</div><div id="total-days" class="stat-value">--</div></div>
      <div class="stat"><div class="stat-label">Next Birthday</div><div id="next-bday" class="stat-value highlight">-- days</div></div>
    </div>
  </div>
  <script>
    function render(data) {
      const d = data?.result || data?.structuredContent?.result || data;
      document.getElementById('years').textContent = d.years || '--';
      document.getElementById('breakdown').textContent = (d.years || '--') + ' years, ' + (d.months || '--') + ' months, ' + (d.days || '--') + ' days';
      document.getElementById('total-days').textContent = d.totalDays?.toLocaleString() || '--';
      document.getElementById('next-bday').textContent = (d.daysUntilNextBirthday || '--') + ' days';
    }
    window.addEventListener('openai:set_globals', () => render(window.openai?.toolOutput?.result));
    window.widgetSetData = render;
    if (window.__WIDGET_DATA__) render(window.__WIDGET_DATA__);
  </script>
</body>
</html>
