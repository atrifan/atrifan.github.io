<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #064e3b 0%, #059669 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 16px; padding: 1.5rem; max-width: 300px; width: 100%; border: 1px solid rgba(255,255,255,0.2); text-align: center; }
    .header { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .icon { font-size: 1.5rem; }
    .title { color: #fff; font-size: 1.1rem; font-weight: 600; }
    .subtitle { color: rgba(255,255,255,0.6); font-size: 0.85rem; margin-bottom: 1rem; }
    .big-number { font-size: 4rem; font-weight: 800; color: #10b981; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header"><span id="icon" class="icon">🎲</span><span id="title" class="title">Random Number</span></div>
    <div id="subtitle" class="subtitle"></div>
    <div id="result" class="big-number">--</div>
  </div>
  <script>
    function render(data) {
      const d = data?.result || data?.structuredContent?.result || data;
      // Detect type: random_number has min/max, lucky_number has luckyNumber
      if (d.luckyNumber !== undefined) {
        document.getElementById('icon').textContent = '🍀';
        document.getElementById('title').textContent = 'Lucky Number';
        document.getElementById('subtitle').textContent = 'Max: ' + (d.max?.toLocaleString() || '--');
        document.getElementById('result').textContent = d.luckyNumber?.toLocaleString() || '--';
      } else {
        document.getElementById('icon').textContent = '🎲';
        document.getElementById('title').textContent = 'Random Number';
        document.getElementById('subtitle').textContent = 'Range: ' + (d.min || 1) + ' - ' + (d.max || 100);
        document.getElementById('result').textContent = d.result || '--';
      }
    }
    window.addEventListener('openai:set_globals', () => render(window.openai?.toolOutput?.result));
    window.widgetSetData = render;
    if (window.__WIDGET_DATA__) render(window.__WIDGET_DATA__);
  </script>
</body>
</html>
