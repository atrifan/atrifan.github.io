<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #164e63 0%, #0891b2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 16px; padding: 1.5rem; max-width: 320px; width: 100%; border: 1px solid rgba(255,255,255,0.2); text-align: center; }
    .header { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .icon { font-size: 1.5rem; }
    .title { color: #fff; font-size: 1.1rem; font-weight: 600; }
    .event-name { color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-bottom: 1rem; }
    .big-number { font-size: 4rem; font-weight: 800; color: #06b6d4; }
    .label { color: #fff; font-size: 1.2rem; margin-bottom: 1rem; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .stat { background: rgba(255,255,255,0.1); padding: 0.75rem; border-radius: 8px; }
    .stat-label { color: rgba(255,255,255,0.6); font-size: 0.75rem; text-transform: uppercase; }
    .stat-value { color: #fff; font-size: 1.1rem; font-weight: 600; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header"><span class="icon">📅</span><span class="title">Countdown</span></div>
    <div id="event" class="event-name">--</div>
    <div id="days" class="big-number">--</div>
    <div id="label" class="label">days to go</div>
    <div class="stats">
      <div class="stat"><div class="stat-label">Weeks</div><div id="weeks" class="stat-value">--</div></div>
      <div class="stat"><div class="stat-label">Months</div><div id="months" class="stat-value">--</div></div>
    </div>
  </div>
  <script>
    function render(data) {
      const d = data?.result || data?.structuredContent?.result || data;
      document.getElementById('event').textContent = d.eventName || '--';
      if (d.isToday) {
        document.getElementById('days').textContent = 'TODAY!';
        document.getElementById('label').textContent = '';
      } else {
        document.getElementById('days').textContent = Math.abs(d.days || 0);
        document.getElementById('label').textContent = d.isPast ? 'days ago' : 'days to go';
      }
      document.getElementById('weeks').textContent = d.weeks || '--';
      document.getElementById('months').textContent = d.months || '--';
    }
    window.addEventListener('openai:set_globals', () => render(window.openai?.toolOutput?.result));
    window.widgetSetData = render;
    if (window.__WIDGET_DATA__) render(window.__WIDGET_DATA__);
  </script>
</body>
</html>
