<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 16px; padding: 1.5rem; max-width: 320px; width: 100%; border: 1px solid rgba(255,255,255,0.2); }
    .header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
    .icon { font-size: 1.5rem; }
    .title { color: #fff; font-size: 1.1rem; font-weight: 600; }
    .big-number { text-align: center; font-size: 4rem; font-weight: 800; margin: 1rem 0; }
    .category { text-align: center; padding: 0.5rem 1rem; border-radius: 20px; font-weight: 700; margin-bottom: 1rem; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .stat { background: rgba(255,255,255,0.1); padding: 0.75rem; border-radius: 8px; text-align: center; }
    .stat-label { color: rgba(255,255,255,0.6); font-size: 0.75rem; text-transform: uppercase; }
    .stat-value { color: #fff; font-size: 1.1rem; font-weight: 600; margin-top: 0.25rem; }
    .underweight { color: #60a5fa; background: rgba(96,165,250,0.2); }
    .normal { color: #10b981; background: rgba(16,185,129,0.2); }
    .overweight { color: #f59e0b; background: rgba(245,158,11,0.2); }
    .obese { color: #ef4444; background: rgba(239,68,68,0.2); }
  </style>
</head>
<body>
  <div class="card">
    <div class="header"><span class="icon">📏</span><span class="title">BMI Calculator</span></div>
    <div id="bmi-value" class="big-number">--</div>
    <div id="category" class="category">--</div>
    <div class="stats">
      <div class="stat"><div class="stat-label">Weight</div><div id="weight" class="stat-value">--</div></div>
      <div class="stat"><div class="stat-label">Height</div><div id="height" class="stat-value">--</div></div>
    </div>
  </div>
  <script>
    function render(data) {
      const d = data?.result || data?.structuredContent?.result || data;
      document.getElementById('bmi-value').textContent = d.bmi || '--';
      const cat = (d.category || 'normal').toLowerCase();
      const catEl = document.getElementById('category');
      catEl.textContent = d.category || '--';
      catEl.className = 'category ' + cat;
      document.getElementById('bmi-value').style.color = getComputedStyle(catEl).color;
      if (d.weight) document.getElementById('weight').textContent = d.weight + ' kg';
      if (d.height) document.getElementById('height').textContent = d.height + ' cm';
    }
    window.addEventListener('openai:set_globals', () => render(window.openai?.toolOutput?.result));
    window.widgetSetData = render;
    if (window.__WIDGET_DATA__) render(window.__WIDGET_DATA__);
  </script>
</body>
</html>
