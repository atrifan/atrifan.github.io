<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 16px; padding: 1.5rem; max-width: 300px; width: 100%; border: 1px solid rgba(255,255,255,0.2); text-align: center; }
    .header { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .icon { font-size: 1.5rem; }
    .title { color: #fff; font-size: 1.1rem; font-weight: 600; }
    .subtitle { color: rgba(255,255,255,0.6); font-size: 0.85rem; margin-bottom: 1rem; }
    .emoji { font-size: 3rem; margin-bottom: 0.5rem; }
    .decision { font-size: 2rem; font-weight: 800; }
    .options-count { color: rgba(255,255,255,0.6); font-size: 0.85rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header"><span class="icon">🤔</span><span class="title">Decision Maker</span></div>
    <div id="subtitle" class="subtitle">Yes or No?</div>
    <div id="emoji" class="emoji">✅</div>
    <div id="decision" class="decision">Yes</div>
    <div id="options" class="options-count" style="display:none;"></div>
  </div>
  <script>
    function render(data) {
      const d = data?.result || data?.structuredContent?.result || data;
      const decision = d.decision || '--';
      const isYesNo = d.mode === 'yesNo';
      const isYes = decision.toLowerCase() === 'yes';
      document.getElementById('subtitle').textContent = isYesNo ? 'Yes or No?' : 'Random Pick';
      document.getElementById('emoji').textContent = isYesNo ? (isYes ? '✅' : '❌') : '🎯';
      document.getElementById('decision').textContent = decision;
      document.getElementById('decision').style.color = isYesNo ? (isYes ? '#10b981' : '#ef4444') : '#8b5cf6';
      if (!isYesNo && d.options?.length) {
        document.getElementById('options').style.display = 'block';
        document.getElementById('options').textContent = 'From ' + d.options.length + ' options';
      }
    }
    window.addEventListener('openai:set_globals', () => render(window.openai?.toolOutput?.result));
    window.widgetSetData = render;
    if (window.__WIDGET_DATA__) render(window.__WIDGET_DATA__);
  </script>
</body>
</html>
