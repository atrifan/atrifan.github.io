<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #78350f 0%, #a16207 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 16px; padding: 1.5rem; max-width: 280px; width: 100%; border: 1px solid rgba(255,255,255,0.2); text-align: center; }
    .header { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; }
    .icon { font-size: 1.5rem; }
    .title { color: #fff; font-size: 1.1rem; font-weight: 600; }
    .coin { width: 120px; height: 120px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .coin.heads { background: linear-gradient(135deg, #fef3c7 0%, #fbbf24 50%, #d97706 100%); border: 4px solid #b45309; }
    .coin.tails { background: linear-gradient(135deg, #f3f4f6 0%, #9ca3af 50%, #6b7280 100%); border: 4px solid #4b5563; }
    .coin-text { font-size: 3rem; font-weight: 800; }
    .coin.heads .coin-text { color: #92400e; }
    .coin.tails .coin-text { color: #374151; }
    .result { font-size: 2rem; font-weight: 800; color: #fbbf24; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header"><span class="icon">🪙</span><span class="title">Coin Flip</span></div>
    <div id="coin" class="coin heads"><span class="coin-text">H</span></div>
    <div id="result" class="result">HEADS</div>
  </div>
  <script>
    function render(data) {
      const d = data?.result || data?.structuredContent?.result || data;
      const result = (d.result || 'heads').toLowerCase();
      const isHeads = result === 'heads';
      const coinEl = document.getElementById('coin');
      coinEl.className = 'coin ' + result;
      coinEl.querySelector('.coin-text').textContent = isHeads ? 'H' : '50';
      document.getElementById('result').textContent = result.toUpperCase();
    }
    window.addEventListener('openai:set_globals', () => render(window.openai?.toolOutput?.result));
    window.widgetSetData = render;
    if (window.__WIDGET_DATA__) render(window.__WIDGET_DATA__);
  </script>
</body>
</html>
