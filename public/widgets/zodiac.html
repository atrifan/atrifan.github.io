<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #831843 0%, #be123c 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 16px; padding: 1.5rem; max-width: 320px; width: 100%; border: 1px solid rgba(255,255,255,0.2); text-align: center; }
    .header { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; }
    .icon { font-size: 1.5rem; }
    .title { color: #fff; font-size: 1.1rem; font-weight: 600; }
    .signs { display: flex; justify-content: center; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .sign { text-align: center; }
    .sign-symbol { font-size: 2.5rem; }
    .sign-name { color: #fff; font-weight: 600; font-size: 0.9rem; margin-top: 0.25rem; }
    .heart { font-size: 1.5rem; }
    .compat { font-size: 3.5rem; font-weight: 800; }
    .message { margin-top: 0.5rem; }
    .message-emoji { font-size: 1.5rem; }
    .message-text { color: rgba(255,255,255,0.8); margin-top: 0.25rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header"><span class="icon">💫</span><span class="title">Zodiac Match</span></div>
    <div class="signs">
      <div class="sign"><span id="sign1-symbol" class="sign-symbol">♈</span><div id="sign1-name" class="sign-name">--</div></div>
      <span class="heart">❤️</span>
      <div class="sign"><span id="sign2-symbol" class="sign-symbol">♉</span><div id="sign2-name" class="sign-name">--</div></div>
    </div>
    <div id="compat" class="compat">--%</div>
    <div class="message"><span id="msg-emoji" class="message-emoji">💕</span><div id="msg-text" class="message-text">--</div></div>
  </div>
  <script>
    function getColor(p) { return p >= 80 ? '#10b981' : p >= 60 ? '#22c55e' : p >= 40 ? '#eab308' : '#ef4444'; }
    function getMsg(p) { return p >= 80 ? ['💕','Perfect Match!'] : p >= 60 ? ['💖','Great Connection'] : p >= 40 ? ['💛','Good Potential'] : ['💔','Challenging']; }
    function render(data) {
      const d = data?.result || data?.structuredContent?.result || data;
      document.getElementById('sign1-symbol').textContent = d.person1?.symbol || '♈';
      document.getElementById('sign1-name').textContent = d.person1?.name || '--';
      document.getElementById('sign2-symbol').textContent = d.person2?.symbol || '♉';
      document.getElementById('sign2-name').textContent = d.person2?.name || '--';
      const compat = d.compatibility || 0;
      document.getElementById('compat').textContent = compat + '%';
      document.getElementById('compat').style.color = getColor(compat);
      const [emoji, text] = getMsg(compat);
      document.getElementById('msg-emoji').textContent = emoji;
      document.getElementById('msg-text').textContent = text;
    }
    window.addEventListener('openai:set_globals', () => render(window.openai?.toolOutput?.result));
    window.widgetSetData = render;
    if (window.__WIDGET_DATA__) render(window.__WIDGET_DATA__);
  </script>
</body>
</html>
