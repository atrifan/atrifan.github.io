<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="50%" stop-color="#764ba2"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Full bleed square background - iOS will apply its own rounded mask -->
  <rect x="0" y="0" width="512" height="512" fill="url(#logoGradient)"/>
  <!-- Lightning bolt centered and scaled -->
  <path d="M290 107 L192 248 L248 248 L222 405 L320 235 L264 235 L290 107Z" fill="url(#boltGradient)" stroke="#fff" stroke-width="8"/>
</svg>

