name: "Baby Blood Type Calculator"
description: "Calculate possible baby blood types from parents with O+ father and A- mother"
version: 1

trigger:
  type: manual

steps:
  - id: calculateBabyBlood
    tool: default.blood_calculator
    params:
      calculatorMode: "baby"
      fatherBloodType: "O"
      fatherRh: "+"
      motherBloodType: "A"
      motherRh: "-"
    output: babyBloodResult

  - id: complete
    return:
      possibleTypes: "{{babyBloodResult.possibleTypes}}"
      rhIncompatibilityRisk: "{{babyBloodResult.rhIncompatibilityRisk}}"
      rhWarning: "{{babyBloodResult.rhWarning}}"

constraints:
  maxToolCalls: 5
  timeout: "1m"

