name: "Birthday Checker"
description: "Check if a person is an adult and calculate days until their next birthday"
version: 1

trigger:
  type: manual

inputs:
  - name: birthDate
    type: string
    required: true
    description: "Birth date in YYYY-MM-DD format"
  - name: notifyEmail
    type: string
    required: false
    description: "Email to send notification (optional)"

steps:
  # Step 1: Calculate age from birthdate
  - id: getAge
    tool: default.calculate_age
    params:
      birthDate: "{{birthDate}}"
    output: ageResult

  # Step 2: Get date info for today
  - id: getTodayInfo
    tool: default.when_date_info
    params:
      date: "{{new Date().toISOString().split('T')[0]}}"
    output: todayInfo

  # Step 3: Check if adult (18+) with if/else
  - id: checkAdult
    if: ageResult.years >= 18
    then:
      # Adult path
      - id: setAdultStatus
        set: status
        value: "adult"
      
      - id: setMessage
        set: message
        value: "You are {{ageResult.years}} years old - an adult! 🎉"
      
      # Check if birthday is coming soon (within 30 days)
      - id: checkBirthdaySoon
        if: ageResult.daysUntilBirthday <= 30
        then:
          - id: setBirthdayMessage
            set: birthdayAlert
            value: "🎂 Your birthday is in {{ageResult.daysUntilBirthday}} days!"
        else:
          - id: setNoBirthdayAlert
            set: birthdayAlert
            value: "Your next birthday is on {{ageResult.nextBirthday}}"
    
    else:
      # Minor path
      - id: setMinorStatus
        set: status
        value: "minor"
      
      - id: setMinorMessage
        set: message
        value: "You are {{ageResult.years}} years old - a minor. You'll be an adult in {{18 - ageResult.years}} years."
      
      - id: setMinorBirthdayAlert
        set: birthdayAlert
        value: "Your next birthday is on {{ageResult.nextBirthday}} ({{ageResult.daysUntilBirthday}} days away)"

  # Step 4: Build summary
  - id: buildSummary
    code: |
      ({
        status: status,
        age: ageResult.years,
        totalDaysLived: ageResult.totalDays,
        message: message,
        birthdayAlert: birthdayAlert,
        todayIs: todayInfo.dayOfWeek,
        zodiacSign: todayInfo.zodiacSign
      })
    output: summary

  # Step 5: Return the result
  - id: done
    return:
      success: true
      data: "{{summary}}"
      checkedAt: "{{new Date().toISOString()}}"

constraints:
  maxToolCalls: 10
  timeout: "1m"

