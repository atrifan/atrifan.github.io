name: "Notification Tester"
id: "notification_tester"
description: "Test push notifications and email notifications"
version: 1

trigger:
  type: manual

inputs:
  - name: notifyEmail
    type: string
    required: true
    description: "Email address to send test notification"
  - name: testMessage
    type: string
    required: false
    default: "This is a test notification from Tulzo!"
    description: "Custom message for the notification"

steps:
  # Step 1: Send push notification
  - id: sendPush
    tool: default.send_push_notification
    params:
      title: "🔔 Test Notification"
      body: "{{testMessage}}"
      type: "automation"
      requireInteraction: true
    output: pushResult

  # Step 2: Check push result and send email
  - id: checkPushResult
    if: pushResult.success === true
    then:
      - id: setPushStatus
        set: pushStatus
        value: "✅ Push notification sent to {{pushResult.sent}} device(s)"
    else:
      - id: setPushFailed
        set: pushStatus
        value: "❌ Push notification failed: {{pushResult.message}}"

  # Step 3: Send email notification via Resend
  - id: sendEmail
    tool: default.send_email
    params:
      to: "{{notifyEmail}}"
      subject: "🧪 Test Email from Tulzo Automation"
      body: |
        <h1>Test Email Notification</h1>
        <p>{{testMessage}}</p>
        <hr>
        <p><strong>Push Notification Status:</strong> {{pushStatus}}</p>
        <p><em>Sent at: {{new Date().toISOString()}}</em></p>
      isHtml: true
    output: emailResult

  # Step 4: Check email result
  - id: checkEmailResult
    if: emailResult.success === true
    then:
      - id: setEmailStatus
        set: emailStatus
        value: "✅ Email sent successfully to {{notifyEmail}}"
    else:
      - id: setEmailFailed
        set: emailStatus
        value: "❌ Email failed: {{emailResult.error}}"

  # Step 5: Build summary
  - id: buildSummary
    code: |
      ({
        pushNotification: {
          success: pushResult.success,
          devicesSent: pushResult.sent || 0,
          status: pushStatus
        },
        emailNotification: {
          success: emailResult.success,
          recipient: notifyEmail,
          status: emailStatus
        },
        testMessage: testMessage,
        timestamp: new Date().toISOString()
      })
    output: summary

  # Step 6: Return the result
  - id: done
    return:
      success: true
      data: "{{summary}}"
      message: "Notification test complete"

constraints:
  maxToolCalls: 10
  timeout: "1m"
